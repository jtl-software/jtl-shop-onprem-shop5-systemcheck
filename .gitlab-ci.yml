stages:
  - test
  - cleanUpTest
  - build
  - deploy
  - cleanUp

.testingScript: &testingScript |
  export CI_CONTAINER_NAME=ci-job-$CI_PROJECT_NAME-testing-$CI_COMMIT_SHA-php$PHP_VERSION_TEST_STEP

  function testing() {
    echo "Testing projekt in PHP $PHP_VERSION_TEST_STEP docker image..."

    docker run \
      --volume $(pwd):/dockerBuild \
      --name="$CI_CONTAINER_NAME" \
      "$CI_REGISTRY_IMAGE/php$PHP_VERSION_TEST_STEP" \
      sh -c "cp -r /dockerBuild/. /systemcheck; bash build/scripts/tests.sh"

    docker stop "$CI_CONTAINER_NAME"
    docker rm -fv "$CI_CONTAINER_NAME" >/dev/null

    echo "Tests finished"
  }

.cleanUpTesting: &cleanUpTesting |
  function failedTesting() {
    export CI_CONTAINER_NAME=ci-job-$CI_PROJECT_NAME-testing-$CI_COMMIT_SHA-php$PHP_VERSION_TEST_STEP
    export running=$(docker inspect -f '{{.State.Running}}' $CI_CONTAINER_NAME)

    if [[ ! -z "$running" ]]; then
      docker stop $CI_CONTAINER_NAME && docker rm -fv $CI_CONTAINER_NAME
    fi
  }

.preBuildDeployScripts: &preBuildDeployScripts |
  export CI_CONTAINER_NAME=ci-job-$CI_PROJECT_NAME-build-deploy-$CI_COMMIT_SHA
  export SP_VERSION=$(echo "$CI_SERVER_VERSION" | sed 's/^\([0-9]*\)\.\([0-9]*\).*/\1-\2-stable/')
  export BUILD_SCRIPT_PATH=build/scripts/build.sh
  export DEPLOY_SCRIPT_PATH=build/scripts/deploy.sh

  function dockerLogin() {
    echo "Logging to GitLab Container Registry with CI credentials..."
    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    echo ""
  }
  function buildProcess() {
    echo "Building projekt in PHP 7.2 docker image..."

    docker run \
      -dit \
      --volume $CI_PROJECT_DIR.tmp/CI_SERVER_TLS_CA_FILE:$CI_PROJECT_DIR.tmp/CI_SERVER_TLS_CA_FILE \
      --volume $(pwd):/dockerBuild \
      --name="$CI_CONTAINER_NAME" \
      $CI_REGISTRY_IMAGE/php7.2

    docker exec \
      $CI_CONTAINER_NAME \
      sh -c "cp -r /dockerBuild/. /systemcheck; bash $BUILD_SCRIPT_PATH '/systemcheck'"

    echo "Build finished"
  }
  function deployProcess() {
    echo "Deploying archive to build server..."

    docker exec \
      $CI_CONTAINER_NAME \
      sh -c "bash $DEPLOY_SCRIPT_PATH $CI_PROJECT_NAME $CI_COMMIT_REF_NAME /archive /systemcheck"

    docker cp $CI_CONTAINER_NAME:/archive/. $CI_BUILD_SERVER_ARCHIVE_PATH
    docker stop "$CI_CONTAINER_NAME"
    docker rm -fv "$CI_CONTAINER_NAME" >/dev/null
  }

.postBuildDeployScripts: &postBuildDeployScripts |
  function dockerLogout() {
    if [[ -n "$CI_USER_VAR" ]]; then
      echo "Logout from GitLab Container Registry with CI credentials..."
      docker logout "$CI_REGISTRY"
      echo ""
    fi
  }

.cleanUpScript: &cleanUpScript |
  function failedScript() {
    export CI_CONTAINER_NAME=ci-job-$CI_PROJECT_NAME-build-deploy-$CI_COMMIT_SHA
    export running=$(docker inspect -f '{{.State.Running}}' $CI_CONTAINER_NAME)

    if [[ ! -z "$running" ]]; then
      docker stop $CI_CONTAINER_NAME && docker rm -fv $CI_CONTAINER_NAME
    fi
  }

test_PHP_7.2:
  stage: test
  variables:
    PHP_VERSION_TEST_STEP: '7.2'
  script:
    - *testingScript
    - testing
  only:
    - branches
  except:
    - master
    - /^release\/.*$/
  tags:
    - build

test_PHP_7.3:
  stage: test
  variables:
    PHP_VERSION_TEST_STEP: '7.3'
  script:
    - *testingScript
    - testing
  only:
    - branches
  except:
    - master
    - /^release\/.*$/
  tags:
    - build

removeContainerPHP7.2:
  stage: cleanUpTest
  variables:
    PHP_VERSION_TEST_STEP: '7.2'
  script:
    - *cleanUpTesting
    - failedTesting
  only:
    - branches
  except:
    - master
    - /^release\/.*$/
  when: on_failure
  tags:
    - build

removeContainerPHP7.3:
  stage: cleanUpTest
  variables:
    PHP_VERSION_TEST_STEP: '7.3'
  script:
    - *cleanUpTesting
    - failedTesting
  only:
    - branches
  except:
    - master
    - /^release\/.*$/
  when: on_failure
  tags:
    - build

build:
  stage: build
  before_script:
    - *preBuildDeployScripts
    - dockerLogin
  script:
    - buildProcess
  after_script:
    - *postBuildDeployScripts
    - dockerLogout
  only:
    - master
    - /^release\/.*$/
  tags:
    - build

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none
  before_script:
    - *preBuildDeployScripts
    - dockerLogin
  script:
    - deployProcess
    - buildscript pipeline:build tool $CI_PROJECT_NAME $CI_PROJECT_DIR $CI_COMMIT_REF_NAME $CI_COMMIT_SHA shop5-systemcheck
  after_script:
    - *postBuildDeployScripts
    - dockerLogout
  only:
    - master
    - /^release\/.*$/
  when: on_success
  tags:
    - build

removeContainer:
  stage: cleanUp
  script:
    - *cleanUpScript
    - failedScript
  only:
    - master
    - /^release\/.*$/
  when: on_failure
  tags:
    - build
